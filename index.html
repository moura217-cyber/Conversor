<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Real e Dólar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Conversor de Real e Dólar</h1>

        <form id="form-conversao" novalidate></form>
        <label for="valor" id="rotulo-origem">Valor em reais (BRL)</label>
        <input id="valor" type="text" inputmode="decimal" autocomplete="off" value="100"
        aria-describedby="ajuda-valor erro-valor">

        <p id="erro-valor" class="erro" role="alert" hidden></p>

        
    </main>
</body>
</html>
